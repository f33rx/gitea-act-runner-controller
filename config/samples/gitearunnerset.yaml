apiVersion: giteaactions.blackrabbitpursuits.com/v1alpha1
kind: GiteaRunnerSet
metadata:
  name: garc-dev-echo
  namespace: default
spec:
  giteaConfigUrl: http://gitea-http.gitea.svc.cluster.local:3000
  giteaConfigSecretRef:
    name: gitea-runner-creds
    key: token
  runnerScope: org
  orgName: garc-dev
  labels:
    - "ubuntu-latest"
  minRunners: 0
  maxRunners: 10
  template:
    spec:
      serviceAccountName: gitea-runner
      restartPolicy: Never
      containers:
      - name: act-runner
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 2
            memory: 2Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-runner-creds
  namespace: default
type: Opaque
stringData:
  # Gitea access token with read:organization (queue polling, registration tokens)
  # and read:repository (stall liveness reads job-log sizes; ADR 0006/0008).
  token: "YOUR_ORG_TOKEN_HERE"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-runner
  namespace: default
