{{- /*
The manager sets this ServiceAccount on every runner Pod, and the ServiceAccount
admission plugin rejects a Pod whose ServiceAccount does not exist. Create it in each
watched namespace (where GiteaRunnerSets, and therefore runner Pods, live). act_runner
never talks to the Kubernetes API, so no token is mounted.
*/ -}}
{{- if .Values.runner.serviceAccount.create }}
{{- range $ns := splitList "," (include "gitea-actions-controller.watchNamespaces" .) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Values.runner.serviceAccount.name }}
  namespace: {{ $ns }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
